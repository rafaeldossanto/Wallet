spring:
  application:
    name: bff
  threads:
    virtual:
      # The BFF mostly waits on the core.
      enabled: true

server:
  port: 8080
  # X-Forwarded-* is NOT applied to the request: in "framework" mode Spring believed it from any
  # client, which let anyone pick a fresh IP per request and skip the rate limit. The client's
  # address behind a reverse proxy comes from wallet.rate-limit.trusted-proxies instead.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health

wallet:
  core:
    url: ${WALLET_CORE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    # Shared secret sent in X-Gateway-Key on every call to the core; the core refuses calls
    # without it. Same value in both services. Empty = development key (local only); with
    # SPRING_PROFILES_ACTIVE=prod an empty, short (< 32 chars) or development key stops the boot.
    gateway-key: ${WALLET_GATEWAY_KEY:}
  jwt:
    issuer: wallet-core
  web:
    # Flutter web in development: flutter run -d chrome --web-port 5000
    allowed-origins: ${WALLET_WEB_ALLOWED_ORIGINS:http://localhost:5000}
    # Browsers accept Secure cookies on http://localhost, so this can stay on in development.
    cookie-secure: true
  cache:
    screen-ttl: 60s
  rate-limit:
    enabled: true
    window: 1m
    # Per IP on /api/auth: brute force protection on top of the core's per-account lockout.
    auth-limit: 20
    # Per user (or per IP when anonymous) on everything else.
    default-limit: 300
    # Reverse proxies whose X-Forwarded-For is believed, as IPs or CIDR ranges separated by
    # commas (e.g. 127.0.0.1,10.0.0.0/8). Only the hops they appended count: the client is the
    # first address from the right that is not one of them. Empty = the connection's own address,
    # whatever the header says (right when the BFF faces the clients directly).
    trusted-proxies: ${WALLET_TRUSTED_PROXIES:}
