spring:
  application:
    name: bff
  threads:
    virtual:
      # The BFF mostly waits on the core.
      enabled: true

server:
  port: 8080
  # X-Forwarded-* is NOT applied to the request: in "framework" mode Spring believed it from any
  # client, which let anyone pick a fresh IP per request and skip the rate limit. The client's
  # address behind a reverse proxy comes from wallet.rate-limit.trusted-proxies instead.
  forward-headers-strategy: none
  tomcat:
    # Same ceiling as wallet.http.max-body-size: a form body Tomcat parses, and how much of a body
    # nobody read Tomcat swallows before dropping the connection.
    max-http-form-post-size: ${wallet.http.max-body-size}
    max-swallow-size: ${wallet.http.max-body-size}

management:
  server:
    # The actuator lives on a port of its own, on loopback only: the full health and the readiness
    # probe answer whoever is on this machine (a script, systemd, a Docker HEALTHCHECK), never the
    # internet. The public port only has /livez. It must differ from server.port: the boot fails
    # otherwise (ManagementSecurityConfig).
    port: ${WALLET_BFF_MANAGEMENT_PORT:9080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Only reachable from the machine itself (above), so it can say what is down.
      show-details: always
      probes:
        enabled: true
      group:
        # Is the process alive? Answered from memory: also served on the public port at /livez,
        # open to anyone (a load balancer needs no token), so it must stay this cheap.
        liveness:
          include: livenessState
          show-details: never
          additional-path: "server:/livez"
        readiness:
          include: readinessState

wallet:
  http:
    # Largest request body: a larger Content-Length is refused with 413 before anything reads it,
    # and a chunked body is cut at this size while it is read (RequestBodyLimitFilter).
    max-body-size: ${WALLET_MAX_BODY_SIZE:256KB}
  core:
    url: ${WALLET_CORE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    # For the calls where the core waits on Pluggy before answering: deleting an account revokes
    # every connection there, one at a time, up to 10s each.
    slow-read-timeout: 2m
    # Shared secret sent in X-Gateway-Key on every call to the core; the core refuses calls
    # without it. Same value in both services. Empty = development key (local only); with
    # SPRING_PROFILES_ACTIVE=prod an empty, short (< 32 chars) or development key stops the boot.
    gateway-key: ${WALLET_GATEWAY_KEY:}
    # Calls to the core in flight at once, per group of routes (CoreRouteGroup). Each group also
    # has a circuit breaker of its own: a group that times out opens only its circuit, one that
    # fills up answers 503 service.busy only for its routes. screens and search are larger than
    # the core's own bulkheads on purpose: the core decides per user, the BFF only caps the total.
    max-concurrent-calls:
      auth: 16
      reads: 64
      screens: 32
      search: 16
      # Each call can hold a Pluggy request in the core for seconds.
      provider: 16
  jwt:
    issuer: wallet-core
    # Every access token must carry this aud, as the core issues and checks it: a user's session
    # on the Wallet API. A token without it (issued before it existed) is refused with 401 and the
    # app renews it with its refresh token.
    audience: wallet-api
  web:
    # Flutter web in development: flutter run -d chrome --web-port 5000
    allowed-origins: ${WALLET_WEB_ALLOWED_ORIGINS:http://localhost:5000}
    # Browsers accept Secure cookies on http://localhost, so this can stay on in development.
    cookie-secure: true
  webhooks:
    # Pluggy's webhooks (POST /api/webhooks/pluggy): not signed, so only hints, and the route is
    # closed (404) unless this is on. A call gets in only with the secret in X-Wallet-Webhook-Secret
    # (compared in constant time) and, when allowed-ips is set, from one of those addresses.
    # The core registers the hooks at Pluggy with the same secret (a command, see Deploy).
    enabled: ${WALLET_PLUGGY_WEBHOOKS_ENABLED:false}
    # 32+ characters (openssl rand -base64 48). With SPRING_PROFILES_ACTIVE=prod and enabled, it is
    # required: without it the BFF does not start.
    secret: ${WALLET_PLUGGY_WEBHOOK_SECRET:}
    # IPs or CIDR ranges separated by commas that Pluggy calls from. Empty = not checked. The address
    # is the connection's (or the client behind wallet.rate-limit.trusted-proxies).
    allowed-ips: ${WALLET_PLUGGY_WEBHOOK_IPS:}
  cache:
    screen-ttl: 60s
  rate-limit:
    enabled: true
    window: 1m
    # Per IP on /api/auth: brute force protection on top of the core's per-account lockout.
    auth-limit: 20
    # Per user (or per IP when anonymous) on everything else.
    default-limit: 300
    # Per user, on top of default-limit: each link makes the core read up to a year of the bank at
    # Pluggy, and each widget token is a call to Pluggy, all on the apiKey every user shares.
    # Going over answers 429 rate_limit.connections.
    link-limit: 10
    link-window: 1h
    connect-token-limit: 10
    connect-token-window: 1h
    # Per user and window, on top of default-limit: a text search in the statement (GET
    # /api/transactions with q) makes the core decrypt the month's descriptions. The app waits
    # 400 ms after the last key and searches one month: 30 a minute is far beyond typing.
    # Going over answers 429 rate_limit.exceeded.
    search-limit: 30
    # Per user: the export of the user's data (GET /api/me/export) reads everything they have in the
    # core. Going over answers 429 rate_limit.exceeded.
    export-limit: 3
    export-window: 24h
    # Per IP on /api/waitlist/** (the landing page's sign-up, confirmation and unsubscribe, all
    # together): public routes, and each sign-up sends an e-mail to whatever address was typed.
    # Going over answers 429 rate_limit.exceeded.
    waitlist-limit: 5
    waitlist-window: 1h
    # Per IP on /api/webhooks/** (the provider's webhooks, when wallet.webhooks.enabled): public routes.
    # Going over answers 429 rate_limit.exceeded.
    webhook-limit: 60
    # Reverse proxies whose X-Forwarded-For is believed, as IPs or CIDR ranges separated by
    # commas (e.g. 127.0.0.1,10.0.0.0/8). Only the hops they appended count: the client is the
    # first address from the right that is not one of them. Empty = the connection's own address,
    # whatever the header says (right when the BFF faces the clients directly).
    trusted-proxies: ${WALLET_TRUSTED_PROXIES:}
