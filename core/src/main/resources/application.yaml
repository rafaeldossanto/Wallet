spring:
  application:
    name: core
  threads:
    virtual:
      # The core spends most of its time waiting on the data provider and Postgres.
      enabled: true
  datasource:
    # Secrets come from environment variables only; defaults point at the local dev database.
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_dev}
    username: ${WALLET_DB_USERNAME:wallet}
    password: ${WALLET_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8081
  # Interface the core listens on. 0.0.0.0 (every interface) keeps today's behavior; on a single
  # host where the BFF runs next to the core, set WALLET_CORE_ADDRESS=127.0.0.1 so nothing outside
  # the machine reaches the port at all. The gateway key below is required either way.
  address: ${WALLET_CORE_ADDRESS:0.0.0.0}

wallet:
  gateway:
    # Shared secret the BFF sends in X-Gateway-Key; every request without it is refused with 403
    # (only /actuator/health stays open). Same value in both services. Empty = development key
    # (local only); with SPRING_PROFILES_ACTIVE=prod an empty, short (< 32 chars) or development
    # key stops the boot.
    key: ${WALLET_GATEWAY_KEY:}
  jwt:
    issuer: wallet-core
    # PEM text or a path to a .pem file. Both empty = ephemeral key for local development only.
    private-key: ${WALLET_JWT_PRIVATE_KEY:}
    public-key: ${WALLET_JWT_PUBLIC_KEY:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  auth:
    max-failed-logins: 5
    lockout-duration: 15m
    # A device that lost the refresh response may retry the old token within this window.
    refresh-reuse-tolerance: 1m
  crypto:
    # base64 of 32 random bytes (openssl rand -base64 32). Empty = ephemeral, development only.
    data-key: ${WALLET_DATA_KEY:}
  sync:
    interval: 6h
    initial-delay: 1m
    scheduler-enabled: ${WALLET_SYNC_SCHEDULER_ENABLED:true}
    manual-cooldown: 15m
    first-window: 365d
    overlap: 7d
    stale-run-after: 15m
  provider:
    # MEU_PLUGGY: items are pasted from the Meu Pluggy dashboard (development).
    # PLUGGY_CONNECT: items come from the widget and must belong to the user (production).
    connection-mode: ${WALLET_CONNECTION_MODE:MEU_PLUGGY}
    # Where the bank sends the user back after authorizing in the Pluggy Connect widget: the Android
    # app's deep link. Changing it means changing the intent filter in the app's AndroidManifest.xml.
    oauth-redirect-uri: com.wallet.wallet://pluggy-connect
    audit:
      # Every call to Pluggy is recorded in provider_calls; older records are deleted nightly.
      retention: 180d
      cleanup-cron: "0 30 4 * * *"
  pluggy:
    base-url: https://api.pluggy.ai
    # Empty = the core still starts; any call to the provider answers provider.not_configured.
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    timeout: 10s
    api-key-ttl: 2h

management:
  endpoints:
    web:
      exposure:
        include: health
