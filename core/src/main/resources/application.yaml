spring:
  application:
    name: core
  threads:
    virtual:
      # The core spends most of its time waiting on the data provider and Postgres.
      enabled: true
  datasource:
    # Secrets come from environment variables only; defaults point at the local dev database.
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_dev}
    username: ${WALLET_DB_USERNAME:wallet}
    password: ${WALLET_DB_PASSWORD:}
    hikari:
      # Virtual threads put no ceiling on concurrent requests, so the pool is the ceiling on the
      # database. Sized on purpose, not left to the default: the expensive requests are capped
      # below it (wallet.bulkhead.*), so logins, cheap reads and sync writes always find a
      # connection. Each instance holds this many against Postgres' max_connections (100).
      maximum-pool-size: ${WALLET_DB_POOL_SIZE:10}
      # Milliseconds. Waiting longer for a connection than the BFF waits for the core (5s) only
      # turns a busy pool into a "core down" for the BFF's circuit breaker: after 3s the request
      # gets 503 service.busy instead.
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8081
  # Interface the core listens on. Loopback by default: the BFF runs next to it, and nothing outside
  # the machine reaches the port at all. Where the BFF is on another host (containers, deploy) set
  # WALLET_CORE_ADDRESS=0.0.0.0, and then WALLET_GATEWAY_KEY too: the development key is public and
  # the core refuses it on any address but loopback.
  address: ${WALLET_CORE_ADDRESS:127.0.0.1}
  tomcat:
    # Same ceiling as wallet.http.max-body-size: a form body Tomcat parses, and how much of a body
    # nobody read Tomcat swallows before dropping the connection.
    max-http-form-post-size: ${wallet.http.max-body-size}
    max-swallow-size: ${wallet.http.max-body-size}

wallet:
  bulkhead:
    # The expensive kinds of request, and how many run at once: in all (max-concurrent) and per
    # user (max-per-user). Past either the core answers at once, 429 rate_limit.exceeded for the
    # user's share and 503 service.busy for all of it, with Retry-After. search + screens stay
    # below the pool above (10), so the rest of the core is never left without a connection.
    search:
      max-concurrent: 3
      max-per-user: 2
    screens:
      max-concurrent: 5
      max-per-user: 3
    # Held until the background run ends (Pluggy calls and writes), not only for the request.
    manual-sync:
      max-concurrent: 4
      max-per-user: 2
  http:
    # Largest request body: a larger Content-Length is refused with 413 before anything reads it,
    # and a chunked body is cut at this size while it is read (RequestBodyLimitFilter).
    max-body-size: ${WALLET_MAX_BODY_SIZE:256KB}
  gateway:
    # Shared secret the BFF sends in X-Gateway-Key; every request without it is refused with 403
    # (only the liveness probe, /livez, stays open). Same value in both services. Empty = development key
    # (local only); with SPRING_PROFILES_ACTIVE=prod an empty, short (< 32 chars) or development
    # key stops the boot.
    key: ${WALLET_GATEWAY_KEY:}
  jwt:
    issuer: wallet-core
    # The aud of every access token, required here and in the BFF: a user's session on the Wallet
    # API. Anything else the key might ever sign carries another audience and is not a session.
    audience: wallet-api
    # PEM text or a path to a .pem file. Both empty = ephemeral key for local development only;
    # with SPRING_PROFILES_ACTIVE=prod an empty pair stops the boot.
    private-key: ${WALLET_JWT_PRIVATE_KEY:}
    public-key: ${WALLET_JWT_PUBLIC_KEY:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  auth:
    # A device that lost the refresh response may retry the old token within this window.
    refresh-reuse-tolerance: 1m
    # Progressive lockout (LoginThrottle): one e-mail from one client address locks after 5
    # failures, one e-mail from every address after 20; each lockout lasts twice the previous one
    # (15 min up to 24 h), and a day without failures starts the counters over.
    lockout:
      source-max-failures: 5
      account-max-failures: 20
      first-duration: 15m
      max-duration: 24h
      forget-after: 24h
    # BCrypt is slow on purpose: at most this many password checks at once (0 = half the
    # processors); one that waits longer than max-wait answers 429 auth.busy.
    password-checks:
      concurrency: ${WALLET_PASSWORD_CHECK_CONCURRENCY:0}
      max-wait: 2s
    email-links:
      # The BFF's public address: the e-mailed links open its confirmation page. Empty =
      # http://localhost:8080 (development); with SPRING_PROFILES_ACTIVE=prod it is required, https.
      base-url: ${WALLET_PUBLIC_URL:}
      ttl: 24h
      # Links of one kind per account per hour (confirmation, e-mail change, "Esqueci minha
      # senha"), the sign-up's included.
      max-per-hour: 3
      # The "Esqueci minha senha" link: shorter than ttl, because it opens the account.
      password-reset-ttl: 1h
    # Accounts whose e-mail is never confirmed are deleted after this.
    unconfirmed-account-ttl: 7d
    # At most one notice of each kind (sign-up attempt, lockout) per account in this interval.
    notice-interval: 1h
    cleanup-cron: "0 15 4 * * *"
  waitlist:
    # The BFF's public address: the e-mailed links open its waitlist pages. Empty =
    # http://localhost:8080 (development); with SPRING_PROFILES_ACTIVE=prod it is required, https.
    base-url: ${WALLET_PUBLIC_URL:}
    confirm-ttl: 24h
    # A sign-up repeated while unconfirmed gets a new link at most this often.
    resend-interval: 1h
    # Sign-ups nobody confirmed are deleted after this (nightly).
    pending-ttl: 7d
    cleanup-cron: "0 45 4 * * *"
    # The opening announcement is a command, not a setting: wallet.waitlist.announce.id and .file
    # are given on the command line (or WALLET_WAITLIST_ANNOUNCE_ID / _FILE) only for that run, and
    # are deliberately not declared here. rate-per-second is the e-mails sent per second.
    announce:
      rate-per-second: ${WALLET_WAITLIST_ANNOUNCE_RATE_PER_SECOND:1}
  mail:
    # The sender the provider accepts (on Amazon SES, a verified address or domain).
    from: ${WALLET_MAIL_FROM:}
    smtp:
      # Empty = no SMTP: outside production the e-mails (links included) go to the log; with
      # SPRING_PROFILES_ACTIVE=prod the core does not start without it.
      host: ${WALLET_SMTP_HOST:}
      port: ${WALLET_SMTP_PORT:587}
      username: ${WALLET_SMTP_USERNAME:}
      password: ${WALLET_SMTP_PASSWORD:}
      # STARTTLS (587), SSL (465) or NONE (a local test server only; refused with prod).
      security: ${WALLET_SMTP_SECURITY:STARTTLS}
      timeout: 10s
  crypto:
    # base64 of 32 random bytes (openssl rand -base64 32). Empty = ephemeral, development only;
    # with SPRING_PROFILES_ACTIVE=prod an empty key stops the boot.
    data-key: ${WALLET_DATA_KEY:}
  legal:
    # The Terms of Use and the Privacy Policy the user accepts (L15). Change terms-version when the texts change:
    # everyone is asked to accept again. The URLs are the pages of the landing site.
    terms-version: ${WALLET_TERMS_VERSION:2026-10-preliminar}
    terms-url: ${WALLET_TERMS_URL:http://localhost:5181/termos.html}
    privacy-url: ${WALLET_PRIVACY_URL:http://localhost:5181/privacidade.html}
  retention:
    # What each module deletes by itself every night, so personal data is kept only while it serves.
    # Balance history, investment snapshots and closed investments are not here on purpose: they are the
    # history the product shows, and stay while the account exists.
    banking:
      # A transaction the provider stopped reporting (soft-deleted) is deleted for good this long after.
      deleted-transactions-after: 90d
      cleanup-cron: "0 50 4 * * *"
    sync:
      # A sync that ended this long ago is deleted, except the latest of each connection (the manual
      # sync cooldown counts from it).
      finished-runs-after: 90d
      cleanup-cron: "0 55 4 * * *"
    identity:
      # A refresh token that expired or was revoked this long ago is deleted (with wallet.auth.cleanup-cron).
      refresh-tokens-after: 30d
      # Records of access (Marco Civil, art. 15) are kept 6 months and then deleted; 185 days cover any
      # 6 calendar months. They are read only by a court order, in the database.
      access-records-after: 185d
    webhooks:
      # A webhook event (the provider's hint that an item changed) is deleted this long after it arrived.
      events-after: 30d
      cleanup-cron: "0 5 5 * * *"
  webhooks:
    # The provider's webhooks are hints, never trusted: see the BFF (POST /api/webhooks/pluggy checks
    # the secret) and the sync module. Registering them at the provider is a command run once on the
    # server, with the same environment as the core:
    #   java -jar core.jar --spring.main.web-application-type=none --wallet.webhooks.register=true
    # (register is deliberately not set here: the core that serves the API never registers.)
    # The value the provider sends in X-Wallet-Webhook-Secret, the same as the BFF's; 32+ characters.
    secret: ${WALLET_PLUGGY_WEBHOOK_SECRET:}
    # The BFF's public address: the hooks post to <base-url>/api/webhooks/pluggy.
    base-url: ${WALLET_PUBLIC_URL:}
  sync:
    interval: 6h
    initial-delay: 1m
    scheduler-enabled: ${WALLET_SYNC_SCHEDULER_ENABLED:true}
    manual-cooldown: 15m
    first-window: 365d
    overlap: 7d
    stale-run-after: 15m
  provider:
    # MEU_PLUGGY: items are pasted from the Meu Pluggy dashboard (development); any user may link
    # an item without an owner. PLUGGY_CONNECT: items come from the widget and must belong to the
    # user (production). With SPRING_PROFILES_ACTIVE=prod anything but PLUGGY_CONNECT stops the boot.
    connection-mode: ${WALLET_CONNECTION_MODE:MEU_PLUGGY}
    # Where the bank sends the user back after authorizing in the Pluggy Connect widget: the Android
    # app's deep link. Changing it means changing the intent filter in the app's AndroidManifest.xml.
    oauth-redirect-uri: com.wallet.wallet://pluggy-connect
    # Linking one more answers 422 connection.limit_reached.
    max-connections-per-user: 10
    audit:
      # Every call to Pluggy is recorded in provider_calls; older records are deleted nightly.
      retention: 180d
      cleanup-cron: "0 30 4 * * *"
  pluggy:
    base-url: https://api.pluggy.ai
    # Empty = the core still starts; any call to the provider answers provider.not_configured.
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    timeout: 10s
    api-key-ttl: 2h

management:
  server:
    # The actuator lives on a port of its own, on loopback only: the full health (database,
    # disk) and the readiness probe answer whoever is on this machine (a script, systemd, a
    # Docker HEALTHCHECK), never the network. The core's own port only has /livez. It must differ
    # from server.port: the boot fails otherwise (ManagementSecurityConfig).
    port: ${WALLET_CORE_MANAGEMENT_PORT:9081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Only reachable from the machine itself (above), so it can say what is down.
      show-details: always
      probes:
        enabled: true
      group:
        # Is the process alive? Answered from memory, no database: also served on the core's own
        # port at /livez, open to whoever reaches it (no gateway key), so it must stay cheap.
        liveness:
          include: livenessState
          show-details: never
          additional-path: "server:/livez"
        # Can it take requests? Includes the database; management port only.
        readiness:
          include: readinessState, db
