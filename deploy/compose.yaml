# Wallet on one machine: Postgres, core, BFF and Caddy (HTTPS). Step by step: Docs/Arquitetura/Deploy.md.
#
#   cd deploy
#   cp .env.example .env     # fill in
#   docker compose build
#   docker compose up -d
#
# Networks:
#   internal  postgres, core, bff. No way out: the database and the services only talk to each other.
#   edge      bff and caddy. Caddy is the only one that publishes ports (80 and 443).
#   egress    core only: its way out to Pluggy and to the SMTP server. Nothing is published on it.
#
# The management ports (9080 and 9081) listen on loopback inside each container and are never
# published.

name: wallet

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18
    container_name: wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_DB: wallet
      # Empty: the image refuses to create the database, so the first `up` fails loudly.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # postgres:18 keeps its data in a versioned folder below /var/lib/postgresql.
      - wallet-postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username wallet --dbname wallet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  core:
    build: ../core
    image: wallet-core
    container_name: wallet-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError ${CORE_JAVA_OPTS:--Xmx512m}
      # Listens on all interfaces of the internal network, so the gateway key must be strong.
      WALLET_CORE_ADDRESS: 0.0.0.0
      WALLET_GATEWAY_KEY: ${WALLET_GATEWAY_KEY:-}
      WALLET_MAX_BODY_SIZE: ${WALLET_MAX_BODY_SIZE:-256KB}
      WALLET_DB_URL: jdbc:postgresql://postgres:5432/wallet
      WALLET_DB_USERNAME: wallet
      WALLET_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      WALLET_DB_POOL_SIZE: ${WALLET_DB_POOL_SIZE:-10}
      WALLET_JWT_PRIVATE_KEY: ${WALLET_JWT_PRIVATE_KEY:-}
      WALLET_JWT_PUBLIC_KEY: ${WALLET_JWT_PUBLIC_KEY:-}
      WALLET_DATA_KEY: ${WALLET_DATA_KEY:-}
      WALLET_PUBLIC_URL: https://app.${WALLET_DOMAIN:?WALLET_DOMAIN is required (deploy/.env)}
      # The texts the user accepts: the landing pages, unless the .env says otherwise.
      WALLET_TERMS_VERSION: ${WALLET_TERMS_VERSION:-2026-10-preliminar}
      WALLET_TERMS_URL: ${WALLET_TERMS_URL:-https://${WALLET_DOMAIN}/termos.html}
      WALLET_PRIVACY_URL: ${WALLET_PRIVACY_URL:-https://${WALLET_DOMAIN}/privacidade.html}
      WALLET_SMTP_HOST: ${WALLET_SMTP_HOST:-}
      WALLET_SMTP_PORT: ${WALLET_SMTP_PORT:-587}
      WALLET_SMTP_USERNAME: ${WALLET_SMTP_USERNAME:-}
      WALLET_SMTP_PASSWORD: ${WALLET_SMTP_PASSWORD:-}
      WALLET_SMTP_SECURITY: ${WALLET_SMTP_SECURITY:-STARTTLS}
      WALLET_MAIL_FROM: ${WALLET_MAIL_FROM:-}
      WALLET_PASSWORD_CHECK_CONCURRENCY: ${WALLET_PASSWORD_CHECK_CONCURRENCY:-0}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      WALLET_CONNECTION_MODE: PLUGGY_CONNECT
      WALLET_SYNC_SCHEDULER_ENABLED: ${WALLET_SYNC_SCHEDULER_ENABLED:-true}
      # Only the command that registers the webhooks at Pluggy reads it (docs: Deploy.md).
      WALLET_PLUGGY_WEBHOOK_SECRET: ${WALLET_PLUGGY_WEBHOOK_SECRET:-}
    networks: [internal, egress]
    healthcheck:
      # The JRE image has neither curl nor wget: bash talks HTTP to /livez on its own.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/$$1 &&
          printf 'GET /livez HTTP/1.0\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ "$$status" == *" 200 "* ]]
        - healthcheck
        - "8081"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *logging

  bff:
    build: ../bff
    image: wallet-bff
    container_name: wallet-bff
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError ${BFF_JAVA_OPTS:--Xmx256m}
      WALLET_CORE_URL: http://core:8081
      WALLET_GATEWAY_KEY: ${WALLET_GATEWAY_KEY:-}
      WALLET_MAX_BODY_SIZE: ${WALLET_MAX_BODY_SIZE:-256KB}
      # The app and the landing page, as the browser sends them in Origin.
      WALLET_WEB_ALLOWED_ORIGINS: https://${WALLET_DOMAIN},https://app.${WALLET_DOMAIN}
      WALLET_TRUSTED_PROXIES: ${WALLET_TRUSTED_PROXIES:-172.16.0.0/12}
      # Pluggy's webhooks: off (404) unless enabled; the secret is then required (docs: Deploy.md).
      WALLET_PLUGGY_WEBHOOKS_ENABLED: ${WALLET_PLUGGY_WEBHOOKS_ENABLED:-false}
      WALLET_PLUGGY_WEBHOOK_SECRET: ${WALLET_PLUGGY_WEBHOOK_SECRET:-}
      WALLET_PLUGGY_WEBHOOK_IPS: ${WALLET_PLUGGY_WEBHOOK_IPS:-}
    networks: [internal, edge]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/$$1 &&
          printf 'GET /livez HTTP/1.0\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ "$$status" == *" 200 "* ]]
        - healthcheck
        - "8080"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
      args:
        WALLET_DOMAIN: ${WALLET_DOMAIN:?WALLET_DOMAIN is required (deploy/.env)}
    image: wallet-caddy
    container_name: wallet-caddy
    restart: unless-stopped
    depends_on:
      bff:
        condition: service_healthy
    environment:
      WALLET_DOMAIN: ${WALLET_DOMAIN}
      WALLET_ACME_EMAIL: ${WALLET_ACME_EMAIL:?WALLET_ACME_EMAIL is required (deploy/.env)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The certificates: losing them means asking Let's Encrypt again (and its rate limits).
      - wallet-caddy-data:/data
      - wallet-caddy-config:/config
    networks: [edge]
    logging: *logging

networks:
  internal:
    name: wallet-internal
    internal: true
  edge:
    name: wallet-edge
  egress:
    name: wallet-egress

volumes:
  wallet-postgres-data:
    name: wallet-postgres-data
  wallet-caddy-data:
    name: wallet-caddy-data
  wallet-caddy-config:
    name: wallet-caddy-config
