name: Core

on:
  push:
    branches: [master]
    paths: ['core/**', '.github/workflows/core.yml']
  pull_request:
    paths: ['core/**', '.github/workflows/core.yml']
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml

      # The integration tests start Postgres in the runner's Docker (Testcontainers) and stand
      # WireMock in for Pluggy, so no secret is needed. Without keys the core uses throwaway ones.
      - run: ./mvnw -B verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-reports
          path: |
            core/target/surefire-reports
            core/target/failsafe-reports
          retention-days: 7
