name: Android

# The Android app as an APK installed by hand, outside the Play Store (Rafael's tablet). README,
# "App no tablet Android".
on:
  push:
    branches: [main, dev]
    # A version tag (v0.1.4) also attaches the APK to the GitHub release.
    tags: ['v*']
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history, so a tag can be checked against main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      # A tag must carry the pubspec version and sit on main, where releases come from.
      - name: Version
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the pubspec version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tag $GITHUB_REF_NAME is not on main: releases are tagged on main"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Android installs a new APK over the old one only when both carry the same key: the release
      # keystore, kept in four repository secrets. Without them the APK gets this runner's debug
      # key, a different one on every run. The build reads ANDROID_KEYSTORE_PATH and the three
      # other values (android/app/build.gradle.kts).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          present=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ $present -eq 0 ]; then
            echo "::warning title=APK signed with the debug key::The secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are not set. This APK installs, but the next one will only install after uninstalling it, which erases the app's data."
            exit 0
          fi
          if [ $present -ne 4 ]; then
            echo "::error title=Signing secrets incomplete::Set all four of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or none"
            exit 1
          fi
          keystore="$RUNNER_TEMP/wallet-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Signing key rejected::The keystore in ANDROID_KEYSTORE_BASE64 does not open with ANDROID_KEYSTORE_PASSWORD, or has no key named ANDROID_KEY_ALIAS"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # WALLET_BFF_URL is the BFF's public address once it is deployed (a repository variable).
      # Until then the tablet gets the PC's address on the login screen. On failure the end of the
      # output becomes an annotation, readable without a GitHub login.
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          set +e
          flutter build apk --release \
            --dart-define=WALLET_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=WALLET_BFF_URL=${{ vars.WALLET_BFF_URL }} > build-apk.log 2>&1
          status=$?
          set -e
          cat build-apk.log
          if [ $status -ne 0 ]; then
            echo "::error title=flutter build apk failed::$(tail -n 40 build-apk.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-release.apk "build/apk/Wallet-${{ steps.version.outputs.version }}.apk"

      # Not zipped: the run page offers the .apk itself, named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/apk/Wallet-${{ steps.version.outputs.version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the GitHub release
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Wallet-${{ needs.apk.outputs.version }}.apk

      # The Desktop workflow creates the release; this one waits for it and adds the APK.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" "Wallet-${{ needs.apk.outputs.version }}.apk" --clobber
